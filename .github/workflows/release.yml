name: Publicar ARC Image Studio

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar versão da tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não corresponde à versão v$packageVersion do package.json."
          }

      - name: Executar testes
        run: npm test

      - name: Criar o instalador
        run: npm run dist -- --publish never

      - name: Publicar o release completo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $installer = "release/ARC-Image-Studio-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $manifest = "release/latest.yml"
          $assets = @($installer, $blockmap, $manifest)

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Arquivo obrigatório não foi gerado: $asset"
            }
          }

          gh release create $tag @assets `
            --repo "${{ github.repository }}" `
            --title "ARC Image Studio $tag" `
            --notes "Nova aba Receber: transfira arquivos do celular pelo Wi-Fi com QR Code, sem recompressão e sem nuvem." `
            --generate-notes `
            --verify-tag `
            --latest

          $release = gh release view $tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          $publishedNames = @($release.assets.name)
          foreach ($asset in $assets) {
            $name = Split-Path $asset -Leaf
            if ($publishedNames -notcontains $name) {
              throw "Arquivo obrigatório não foi publicado: $name"
            }
          }
